databaseChangeLog:
  - changeSet:
      id: add-product-name-index
      author: you
      changes:
        - createIndex:
            tableName: product
            indexName: idx_product_name
            columns:
              - column:
                  name: name

  - changeSet:
      id: add-unique-product-in-category
      author: you
      changes:
        - addUniqueConstraint:
            tableName: product
            constraintName: uq_product_name_category
            columnNames: name, category_id